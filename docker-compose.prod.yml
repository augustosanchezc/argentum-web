name: ao-server-prod

services:
  # ── Reverse proxy + TLS automático ─────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    environment:
      # Caddy usa {$DOMAIN} en el Caddyfile; hay que inyectarlo al contenedor
      # (la interpolación ${DOMAIN} de compose no llega sola al proceso Caddy).
      DOMAIN: ${DOMAIN}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./packages/client/dist:/srv/client:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - internal

  # ── Servidor del juego ──────────────────────────────────────────────────────
  ao-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # tini como PID 1: reenvía SIGTERM al proceso Node y limpia zombies.
    init: true
    # Tiempo de gracia para el apagado: el server hace flush de TODAS las
    # sesiones a la DB al recibir SIGTERM (deploy). El default de Docker es 10s;
    # lo subimos a 30s para que un flush con muchos jugadores nunca se corte por
    # SIGKILL y no se pierda progreso (XP, items).
    stop_grace_period: 30s
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # Overrides EDITABLES del panel admin (Ajustes/intervalos, criaturas, items)
      # en un volumen persistente → sobreviven a los redeploy (antes se pisaban
      # al reconstruir la imagen).
      AO_OVERRIDES_DIR: /app/state
    volumes:
      - ao_overrides:/app/state
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    # El puerto solo es accesible desde la red interna (Caddy hace proxy).

  # ── Base de datos ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Observabilidad ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - internal
    depends_on:
      - prometheus

networks:
  public:
  internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  ao_overrides:
