services:
  postgres:
    image: postgres:16-alpine
    container_name: ao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argentum}
      POSTGRES_USER: ${POSTGRES_USER:-argentum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argentum_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argentum} -d ${POSTGRES_DB:-argentum}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ao-net

  redis:
    image: redis:7-alpine
    container_name: ao-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ao-net

volumes:
  postgres-data:
  redis-data:

networks:
  ao-net:
    driver: bridge
